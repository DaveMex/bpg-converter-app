name: Build/Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

jobs:
  build:
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Install FPM (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ruby ruby-dev build-essential rpm
          sudo gem install --no-document fpm

      - name: Build Electron App
        # GitHub Actions sets different env vars, electron-builder handles the rest
        # We run the command specific to the OS we are on
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            chmod +x resources/bin/linux/bpgenc || true
            npm run dist:linux
          elif [ "$RUNNER_OS" == "Windows" ]; then
            npm run dist:win
          elif [ "$RUNNER_OS" == "macOS" ]; then
            chmod +x resources/bin/mac/bpgenc || true
            npm run dist:mac
          fi
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          USE_SYSTEM_FPM: "true"
          DEBUG: "electron-builder"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-build
          path: dist
          if-no-files-found: ignore
